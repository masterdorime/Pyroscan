<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PyroScan Cesium spike</title>
  <script>window.CESIUM_BASE_URL = 'cesium/';</script>
  <link rel="stylesheet" href="cesium/Widgets/widgets.css" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070709; }
    #hud {
      position: fixed; left: 16px; top: 16px; z-index: 10; padding: 10px 14px;
      font: 13px/1.4 ui-monospace, monospace; color: #e5a954;
      background: rgba(7, 7, 9, 0.82); border: 1px solid #2a2a32; border-radius: 6px;
      white-space: pre;
    }
    #err {
      position: fixed; left: 16px; bottom: 16px; z-index: 10; max-width: 60vw;
      font: 12px/1.4 ui-monospace, monospace; color: #ff6b5a; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="hud">booting…</div>
  <div id="err"></div>
  <script src="cesium/Cesium.js"></script>
  <script>
    const hud = document.getElementById('hud');
    const errBox = document.getElementById('err');
    const external = [];

    const origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (m, u, ...rest) {
      if (/^https?:/i.test(u) && !u.startsWith(location.origin)) external.push(u);
      return origOpen.call(this, m, u, ...rest);
    };
    const origFetch = window.fetch;
    window.fetch = function (u, ...rest) {
      const url = typeof u === 'string' ? u : u && u.url;
      if (url && /^https?:/i.test(url) && !url.startsWith(location.origin)) external.push(url);
      return origFetch.call(this, u, ...rest);
    };
    window.addEventListener('error', (e) => { errBox.textContent += `\n${e.error?.stack || e.message}`; });
    window.addEventListener('unhandledrejection', (e) => { errBox.textContent += `\n${e.reason?.stack || e.reason}`; });

    (async () => {
      const data = await (await fetch('data/heightmap.json')).json();
      const { width: W, height: H, west, south, east, north } = data;
      const heights = Float32Array.from(data.heights_m, (v) => v + data.base_height_m);

      const pos = new Float64Array(W * H * 3);
      const st = new Float32Array(W * H * 2);
      let p = 0, q = 0;
      for (let j = 0; j < H; j++) {
        const lat = north - (north - south) * (j / (H - 1));
        for (let i = 0; i < W; i++) {
          const lon = west + (east - west) * (i / (W - 1));
          const c = Cesium.Cartesian3.fromDegrees(lon, lat, heights[j * W + i]);
          pos[p++] = c.x; pos[p++] = c.y; pos[p++] = c.z;
          st[q++] = i / (W - 1); st[q++] = 1 - j / (H - 1);
        }
      }
      const idx = new Uint32Array((W - 1) * (H - 1) * 6);
      let k = 0;
      for (let j = 0; j < H - 1; j++) {
        for (let i = 0; i < W - 1; i++) {
          const a = j * W + i, b = a + 1, c = a + W, d = c + 1;
          idx[k++] = a; idx[k++] = c; idx[k++] = b;
          idx[k++] = b; idx[k++] = c; idx[k++] = d;
        }
      }

      let geometry = new Cesium.Geometry({
        attributes: {
          position: new Cesium.GeometryAttribute({
            componentDatatype: Cesium.ComponentDatatype.DOUBLE,
            componentsPerAttribute: 3,
            values: pos,
          }),
          st: new Cesium.GeometryAttribute({
            componentDatatype: Cesium.ComponentDatatype.FLOAT,
            componentsPerAttribute: 2,
            values: st,
          }),
        },
        indices: idx,
        primitiveType: Cesium.PrimitiveType.TRIANGLES,
        boundingSphere: Cesium.BoundingSphere.fromVertices(pos),
      });
      geometry = Cesium.GeometryPipeline.computeNormal(geometry);

      const material = new Cesium.Material({
        fabric: { type: 'Image', uniforms: { image: 'data/ortho.webp' } },
      });

      const credit = document.createElement('div');
      const viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayer: false,
        creditContainer: credit,
        baseLayerPicker: false, geocoder: false, homeButton: false,
        sceneModePicker: false, navigationHelpButton: false,
        animation: false, timeline: false, infoBox: false,
        selectionIndicator: false, fullscreenButton: false, vrButton: false,
        skyBox: false, skyAtmosphere: false,
      });
      viewer.scene.globe.show = false;
      viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#070709');
      viewer.scene.primitives.add(new Cesium.Primitive({
        geometryInstances: new Cesium.GeometryInstance({ geometry }),
        appearance: new Cesium.MaterialAppearance({
          material, translucent: true, flat: false, faceForward: true,
        }),
        asynchronous: false,
      }));

      const hAt = (lon, lat) => {
        const i = Math.max(0, Math.min(W - 1, Math.round(((lon - west) / (east - west)) * (W - 1))));
        const j = Math.max(0, Math.min(H - 1, Math.round(((north - lat) / (north - south)) * (H - 1))));
        return heights[j * W + i];
      };

      const clon = (west + east) / 2;
      const clat = (south + north) / 2;
      const ch = hAt(clon, clat);
      const elon = clon + (east - west) * 0.18;
      const elat = clat + (north - south) * 0.18;

      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(clon, clat, ch),
        point: { pixelSize: 14, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
        label: { text: 'HOTSPOT 01', font: '13px monospace', fillColor: Cesium.Color.WHITE, showBackground: true, backgroundColor: Cesium.Color.fromCssColorString('#070709cc'), pixelOffset: new Cesium.Cartesian2(0, -26) },
      });
      viewer.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArrayHeights([clon, clat, ch + 3, elon, elat, hAt(elon, elat) + 3]),
          width: 4, material: Cesium.Color.ORANGE, arcType: Cesium.ArcType.NONE,
        },
      });

      viewer.camera.lookAt(
        Cesium.Cartesian3.fromDegrees(clon, clat, ch),
        new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-32), 230)
      );
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);

      const samples = [];
      let last = performance.now();
      let frames = 0;
      viewer.scene.postRender.addEventListener(() => {
        const now = performance.now();
        samples.push(now - last);
        last = now;
        if (samples.length > 600) samples.shift();
        frames++;
      });
      setInterval(() => {
        if (samples.length < 30) return;
        const sorted = [...samples].sort((a, b) => a - b);
        const p95 = sorted[Math.floor(sorted.length * 0.95)];
        hud.textContent =
          `p95 ${p95.toFixed(1)} ms  (${(1000 / p95).toFixed(0)} fps)\n` +
          `frames ${frames}  external ${external.length}\n` +
          `mesh ${W}x${H}  ${(east - west).toFixed(5)} x ${(north - south).toFixed(5)} deg\n` +
          `datum +${data.base_height_m} m  z ${(data.h_min + data.base_height_m).toFixed(1)}..${(data.h_max + data.base_height_m).toFixed(1)} m`;
        if (frames > 60) window.__ready = true;
      }, 1000);
      console.log('SPIKE_BOUNDS', west, south, east, north);
    })().catch((e) => { errBox.textContent += `\nBOOT ${e.stack || e}`; console.error(e); });
  </script>
</body>
</html>
